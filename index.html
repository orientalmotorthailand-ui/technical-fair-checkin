<!DOCTYPE html>

<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>


  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }


    h2 {
      margin-bottom: 25px;
    }


    #video-container {

      width: 100%;
      max-width: 600px;

      margin: auto;

      background: black;

      border-radius: 10px;

      overflow: hidden;

    }


    #video {

      width: 100%;

      display: none;

    }


    #canvas {

      width: 100%;

      display: none;

    }


    .btn {

      padding: 12px 25px;

      font-size: 16px;

      border: none;

      border-radius: 6px;

      color: white;

      cursor: pointer;

      margin: 10px;

    }


    .btn-start {

      background: #1976d2;

    }


    .btn-stop {

      background: #d32f2f;

    }


    #status {

      max-width: 600px;

      margin: 20px auto;

      padding: 20px;

      border-radius: 8px;

      font-size: 18px;

      background: white;

    }


    .success {

      background: #d4edda !important;

      color: #155724;

    }


    .error {

      background: #f8d7da !important;

      color: #721c24;

    }


    .loading {

      background: #fff3cd !important;

      color: #856404;

    }


  </style>

</head>



<body>


  <h2>
    Check-in Technical Fair
  </h2>



  <div id="video-container">

    <video
      id="video"
      autoplay
      playsinline>
    </video>


    <canvas
      id="canvas">
    </canvas>

  </div>



  <div>

    <button
      class="btn btn-start"
      onclick="startScan()">

      📷 เปิดกล้อง

    </button>


    <button
      class="btn btn-stop"
      onclick="stopScan()">

      ⛔ ปิดกล้อง

    </button>

  </div>



  <div id="status">

    พร้อมสแกน QR Code

  </div>




<script>


// ========================================
// Element
// ========================================

const video =
  document.getElementById("video");


const canvasElement =
  document.getElementById("canvas");


const canvas =
  canvasElement.getContext("2d");


const statusDiv =
  document.getElementById("status");



// ========================================
// ตัวแปรควบคุม
// ========================================

let scanning = false;

let processing = false;

let currentStream = null;

let lastScannedCode = "";



// ========================================
// เปิดกล้อง
// ========================================

async function startScan() {


  try {


    // ถ้ากำลังเปิดอยู่
    if (scanning) {

      return;

    }


    statusDiv.innerHTML =
      "📷 กำลังเปิดกล้อง...";


    statusDiv.className =
      "loading";


    // ====================================
    // ขอเปิดกล้อง
    // ====================================

    const stream =
      await navigator
      .mediaDevices
      .getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    currentStream =
      stream;


    video.srcObject =
      stream;


    video.style.display =
      "block";


    await video.play();


    scanning =
      true;


    processing =
      false;


    statusDiv.innerHTML =
      "📱 พร้อมสแกน QR Code";


    statusDiv.className =
      "";


    requestAnimationFrame(tick);



  } catch (error) {


    console.error(error);


    statusDiv.innerHTML =
      "❌ ไม่สามารถเปิดกล้องได้<br><br>" +
      error.name +
      "<br>" +
      error.message;


    statusDiv.className =
      "error";

  }

}



// ========================================
// ปิดกล้อง
// ========================================

function stopScan() {


  scanning =
    false;


  processing =
    false;


  if (currentStream) {


    currentStream
      .getTracks()
      .forEach(track => {

        track.stop();

      });


    currentStream =
      null;

  }


  video.srcObject =
    null;


  video.style.display =
    "none";


  statusDiv.innerHTML =
    "⛔ ปิดกล้องแล้ว";


  statusDiv.className =
    "";

}



// ========================================
// Scan QR
// ========================================

function tick() {


  // ถ้าหยุดสแกน
  if (!scanning) {

    return;

  }


  // ถ้ากำลังประมวลผล
  if (processing) {

    requestAnimationFrame(tick);

    return;

  }


  // ตรวจสอบว่ากล้องพร้อม
  if (
    video.readyState ===
    video.HAVE_ENOUGH_DATA
  ) {


    canvasElement.width =
      video.videoWidth;


    canvasElement.height =
      video.videoHeight;


    canvas.drawImage(

      video,

      0,

      0,

      canvasElement.width,

      canvasElement.height

    );



    const imageData =
      canvas.getImageData(

        0,

        0,

        canvasElement.width,

        canvasElement.height

      );



    const code =
      jsQR(

        imageData.data,

        imageData.width,

        imageData.height,

        {

          inversionAttempts:
            "dontInvert"

        }

      );



    // ==================================
    // เจอ QR Code
    // ==================================

    if (code) {


      const registrationId =
        code.data
        .trim()
        .toUpperCase();



      // ป้องกันการอ่านซ้ำ
      if (
        registrationId ===
        lastScannedCode
      ) {

        requestAnimationFrame(tick);

        return;

      }


      processQR(
        registrationId
      );


      return;

    }

  }


  requestAnimationFrame(tick);

}



// ========================================
// ส่งข้อมูลไป Apps Script
// ========================================

function processQR(registrationId) {


  // ล็อกไม่ให้ยิงซ้ำ
  processing =
    true;


  // จำ QR ล่าสุด
  lastScannedCode =
    registrationId;


  statusDiv.innerHTML =
    "⏳ กำลังตรวจสอบข้อมูล...<br><br>" +
    registrationId;


  statusDiv.className =
    "loading";


  console.log(
    "Scanning:",
    registrationId
  );



  // =====================================
  // ส่งไป Google Apps Script
  // =====================================

  google.script.run


    // -----------------------------------
    // สำเร็จ
    // -----------------------------------

    .withSuccessHandler(
      function(response) {


        console.log(
          response
        );


        statusDiv.innerHTML =
          response.message;


        if (response.success) {


          statusDiv.className =
            "success";


        } else {


          statusDiv.className =
            "error";

        }



        // รอ 3 วินาที
        setTimeout(

          function() {


            processing =
              false;


            lastScannedCode =
              "";


            statusDiv.innerHTML =
              "📱 พร้อมสแกน QR Code";


            statusDiv.className =
              "";


          },

          3000

        );

      }
    )



    // -----------------------------------
    // ถ้า Apps Script Error
    // -----------------------------------

    .withFailureHandler(
      function(error) {


        console.error(
          error
        );


        statusDiv.innerHTML =
          "❌ เกิดข้อผิดพลาด<br><br>" +
          error.message;


        statusDiv.className =
          "error";



        setTimeout(

          function() {


            processing =
              false;


            lastScannedCode =
              "";


            statusDiv.innerHTML =
              "📱 พร้อมสแกน QR Code";


            statusDiv.className =
              "";

          },

          3000

        );

      }
    )


    // เรียก Function
    .processCheckIn(
      registrationId
    );

}



</script>



</body>

</html>
